name: Tự động cập nhật dữ liệu Google Map

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Cài đặt thư viện
        run: pip install requests pandas openpyxl
      - name: Chạy code lấy dữ liệu
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }} # Chỗ này phải khớp với os.getenv
        run: python main.py
      - name: Lưu file lên GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.xlsx
          git commit -m "Auto update data" || exit 0
          git push
